name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Check forbidden dash characters
        run: npm run check:dashes

      - name: Generate PWA icons if missing
        run: npm run gen:icons

      - name: Build web app for Capacitor
        env:
          VITE_BASE: './'
        run: npm run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web build into Android
        run: npx cap sync android

      - name: Ensure internet and landscape settings in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            node -e '
              const fs = require("fs");
              const p = process.argv[1];
              let xml = fs.readFileSync(p, "utf8");
              if (!xml.includes("android.permission.INTERNET")) {
                xml = xml.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application");
              }
              if (!xml.includes("android:screenOrientation")) {
                xml = xml.replace("<activity", "<activity android:screenOrientation=\"sensorLandscape\"");
              }
              fs.writeFileSync(p, xml, "utf8");
            ' "$MANIFEST"
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ostrov-dalekih-ogney-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
